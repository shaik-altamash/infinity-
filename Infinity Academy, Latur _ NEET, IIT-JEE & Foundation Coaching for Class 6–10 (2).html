<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:#fff;color:#0B2A3A;font-family:Figtree,system-ui,sans-serif;margin:0}
h1,h2,h3,.font-head{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.zoom img,.zoom .bg{transition:transform .6s}.zoom:hover .bg{transform:scale(1.07)}
:focus-visible{outline:3px solid #0E9AA7;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.kb{animation:kb 14s ease-out forwards}

.beam{position:absolute;top:-25%;left:34%;width:240px;height:160%;transform:rotate(28deg);background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.1) 70%,transparent);filter:blur(26px);mix-blend-mode:screen;pointer-events:none;animation:sway 9s ease-in-out infinite alternate}
.beam.b2{left:48%;width:90px;animation-duration:12s;animation-delay:-4s}
@keyframes sway{from{opacity:.3;transform:rotate(26deg) translateX(-24px)}to{opacity:.7;transform:rotate(31deg) translateX(46px)}}
@media (prefers-reduced-motion:reduce){.kb,.beam{animation:none}}
.drift{animation:drift 14s ease-in-out infinite alternate}
.fan{position:relative;height:440px;overflow:hidden}
.fan-in{position:absolute;bottom:0;left:50%;margin-left:-95px;width:190px;height:440px;transform:scale(var(--s,1));transform-origin:50% 100%}
.ucard{position:absolute;left:0;bottom:70px;width:190px;height:270px;border:4px solid #fff;background:#fff;border-radius:5px;overflow:hidden;cursor:pointer;box-shadow:0 10px 25px rgba(11,42,58,.3);transform-origin:50% 600px;transform:rotate(calc((var(--i) - 4.5)*7deg));z-index:var(--i);transition:transform .35s cubic-bezier(.2,.8,.2,1)}

@media (max-width:760px){.fan-in{--s:.52}.fan{height:270px}}

function Btn({children,onClick,variant="solid",className=""}){

}

const SL=[{img:"studyDesk",t:"NEET Medical"},{img:"jee",t:"IIT-JEE"},{img:"kids",t:"Foundation 6–10"},{img:"group",t:"Regular Classes"}];
const BATCH=new Date("2027-04-01T00:00:00+05:30").getTime();
function Dial({v,max,l}){const r=34,c=2*Math.PI*r;return <div className="relative h-[68px] w-[68px] sm:h-20 sm:w-20 grid place-items-center"><svg viewBox="0 0 80 80" className="absolute inset-0 -rotate-90" aria-hidden="true"><circle cx="40" cy="40" r={r} fill="none" stroke="rgba(255,255,255,.25)" strokeWidth="2"/><circle cx="40" cy="40" r={r} fill="none" stroke="#8BC34A" strokeWidth="2.5" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-Math.min(v/max,1))} style={{transition:"stroke-dashoffset .6s"}}/></svg><div className="text-center leading-none"><div className="font-head font-bold text-lg sm:text-xl">{String(v).padStart(2,"0")}</div><div className="text-[10px] text-white/70 mt-1">{l}</div></div></div>}

function Hero({q,setQ,cat,setCat}){
 const [i,setI]=useState(0),[now,setNow]=useState(Date.now());
 React.useEffect(()=>{const id=setInterval(()=>setI(x=>(x+1)%SL.length),6000);return()=>clearInterval(id)},[i]);
 React.useEffect(()=>{const id=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(id)},[]);
 const d=Math.max(0,BATCH-now),D=[[Math.floor(d/864e5),120,"DAYS"],[Math.floor(d%864e5/36e5),24,"HOURS"],[Math.floor(d%36e5/6e4),60,"MIN"],[Math.floor(d%6e4/1e3),60,"SEC"]];

 return <section id="home" className="relative overflow-hidden text-white bg-ink min-h-[720px] flex">

  <div className="absolute inset-0 bg-gradient-to-r from-ink via-ink/75 to-ink/25"/>

    <form onSubmit={submit} className="mt-8 bg-white rounded-[5px] p-2 flex flex-col sm:flex-row gap-2 shadow-2xl text-ink">
     <input value={q} onChange={e=>setQ(e.target.value)} aria-label="Search courses" placeholder="Search courses, e.g. NEET, Class 9" className="flex-1 px-4 py-3 rounded-[5px] outline-none min-w-0"/>
     <select value={cat} onChange={e=>setCat(e.target.value)} aria-label="Category" className="px-3 py-3 rounded-[5px] bg-mist outline-none">
      <option value="All">All categories</option>{CATS.map(c=><option key={c}>{c}</option>)}
     </select>
     <Btn>Search</Btn>

    </div>
    <button onClick={()=>go("programs")} className="mt-8 flex items-center gap-3 text-sm text-white/85 hover:text-white"><span className="h-9 w-9 rounded-full border border-white/60 grid place-items-center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>Explore our programs</button>
   </div>
  </div>
  <div className="hidden lg:block absolute right-10 xl:right-16 top-1/2 -translate-y-1/2">
   <div className="relative pl-7"><div className="absolute left-[5px] top-3 bottom-3 w-px bg-white/30"/>
    {SL.map((s,k)=><button key={k} onClick={()=>setI(k)} aria-label={s.t} aria-current={k===i} className="relative block mb-5 last:mb-0 text-left">
     <span className={`absolute -left-[28px] top-1/2 -translate-y-1/2 h-3 w-3 rounded-full border-2 transition ${k===i?"bg-lime border-lime scale-125":"bg-ink border-white/60"}`}/>
     <span className={`block relative overflow-hidden rounded-[5px] transition-all duration-500 ${k===i?"w-36 h-24 ring-2 ring-white shadow-xl":"w-28 h-[72px] opacity-60 hover:opacity-100"}`}><img src={IMG[s.img]} alt="" className="w-full h-full object-cover"/><span className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 to-transparent text-[11px] font-semibold px-2 pb-1 pt-4">{s.t}</span></span>
    </button>)}
   </div>
  </div>
  <div className="lg:hidden absolute bottom-5 right-4 flex gap-2">{SL.map((s,k)=><button key={k} onClick={()=>setI(k)} aria-label={s.t} className={`h-2 rounded-full transition-all ${k===i?"w-6 bg-lime":"w-2 bg-white/50"}`}/>)}</div>
 </section>;
}

function Programs({setCat}){
 const count=c=>COURSES.filter(x=>x.c===c).length;
 const pick=c=>{setCat(c);go("courses")};
 const Card=({p,big})=><article className={`zoom relative overflow-hidden rounded-[5px] text-white ${big?"lg:row-span-2 min-h-[340px] lg:min-h-full":"min-h-[220px]"}`}>
  <div className={`bg absolute inset-0 bg-gradient-to-br ${p.g}`}/>
  <img src={IMG[p.img]} alt="" loading="lazy" className="bg absolute inset-0 w-full h-full object-cover"/><div className={`absolute inset-0 bg-gradient-to-br ${p.g} opacity-25`}/>
  <div className="absolute inset-0 bg-gradient-to-t from-black/75 via-black/20 to-transparent"/>
  <div className="relative h-full p-6 flex flex-col justify-end">
   <span className="text-sm bg-white/20 backdrop-blur rounded-[5px] px-3 py-1 w-fit mb-3">{count(p.c)} course{count(p.c)>1?"s":""}</span>
   <h3 className={`font-bold ${big?"text-3xl":"text-2xl"}`}>{p.c==="Regular"?"Regular Classes 6–10":p.c==="Foundation"?"Foundation 6–10":p.c}</h3>
   <p className="text-white/85 mt-1 max-w-sm">{p.d}</p>
   <button onClick={()=>pick(p.c)} className="mt-4 font-semibold underline underline-offset-4 w-fit">Explore courses</button>
  </div>
 </article>;
 return <section id="programs" className="max-w-7xl mx-auto px-4 py-20">
  <h2 className="text-3xl sm:text-4xl font-bold text-center">Explore our programs</h2>
  <p className="text-center text-slate-600 mt-3 max-w-xl mx-auto">Pick the path that fits your class and your goal.</p>
  <div className="mt-10 grid lg:grid-cols-3 lg:grid-rows-2 gap-5">
   <Card p={PROGS[0]} big/><Card p={PROGS[1]}/><Card p={PROGS[2]}/><Card p={PROGS[3]}/>
  </div>
 </section>;
}

function Courses({q,setQ,cat,setCat}){
 const list=useMemo(()=>COURSES.filter(c=>(cat==="All"||c.c===cat)&&(c.t+c.sub+c.boards+c.c).toLowerCase().includes(q.toLowerCase())),[q,cat]);
 const lc={Beginner:"bg-lime/20 text-green-800",Intermediate:"bg-teal/15 text-teal",Advanced:"bg-blue/10 text-blue"};
 return <section id="courses" className="bg-mist py-20"><div className="max-w-7xl mx-auto px-4">
  <h2 className="text-3xl sm:text-4xl font-bold text-center">Our popular courses</h2>
  <div className="mt-8 flex flex-wrap justify-center gap-2">
   {["All",...CATS].map(c=><button key={c} onClick={()=>setCat(c)} aria-pressed={cat===c} className={`px-5 py-2 rounded-[5px] font-medium border transition ${cat===c?"bg-ink text-white border-ink":"bg-white border-slate-300 hover:border-teal"}`}>{c}</button>)}
  </div>
  <div className="mt-4 max-w-md mx-auto"><input value={q} onChange={e=>setQ(e.target.value)} aria-label="Filter courses" placeholder="Search courses" className="w-full rounded-[5px] border border-slate-300 px-5 py-3 bg-white"/></div>
  {list.length===0?<div className="text-center mt-12 text-slate-600">No course matches "{q}". <button className="text-teal font-semibold underline" onClick={()=>{setQ("");setCat("All")}}>Clear filters</button></div>:
  <div className="mt-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
   {list.map(c=><article key={c.id} className="zoom bg-white rounded-[5px] overflow-hidden shadow-sm hover:shadow-xl transition flex flex-col">
    <div className="h-48 relative overflow-hidden"><div className={`bg absolute inset-0 bg-gradient-to-br ${c.g}`}/><img src={IMG[c.img]} alt="" loading="lazy" className="bg absolute inset-0 w-full h-full object-cover"/><div className="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"/><div className="absolute left-3 top-3 h-10 w-10 rounded-[5px] bg-white/90 text-teal grid place-items-center"><Icon n={c.i} className="w-6 h-6"/></div></div>
    <div className="p-6 flex-1 flex flex-col">
     <span className={`text-xs font-semibold px-3 py-1 rounded-[5px] w-fit ${lc[c.lvl]}`}>{c.lvl}</span>
     <h3 className="text-xl font-bold mt-3">{c.t}</h3>
     <p className="text-slate-600 mt-1">{c.sub}</p>
     <dl className="mt-3 text-sm text-slate-600 space-y-1"><div><dt className="inline font-semibold text-ink">Syllabus: </dt><dd className="inline">{c.boards}</dd></div><div><dt className="inline font-semibold text-ink">Duration: </dt><dd className="inline">{c.dur}</dd></div><div><dt className="inline font-semibold text-ink">Includes: </dt><dd className="inline">DSP, lab sessions, mentorship</dd></div></dl>
     <button onClick={()=>go("contact")} className="mt-5 w-full rounded-[5px] bg-ink text-white py-3 font-semibold hover:bg-teal transition">Enroll now</button>
    </div>
   </article>)}
  </div>}
 </div></section>;
}

function Why(){
 const F=[["cap","Experienced faculty","Teachers who know the NEET, JEE and board patterns and explain concepts simply."],["users","Personalised mentorship","Regular one-to-one guidance so no student is left behind."],["pencil","DSP practice","Daily practice sets that turn classroom learning into exam speed."],["flask","Science lab","Hands-on experiments that make Physics, Chemistry and Biology click."],["monitor","Digital classrooms","Visual, smart-board teaching for clearer concepts."],["books","All boards covered","State Board, CBSE and ICSE for Class 6–10."]];
 return <section id="why" className="max-w-7xl mx-auto px-4 py-20">
  <h2 className="text-3xl sm:text-4xl font-bold text-center">Why choose Infinity Academy?</h2>
  <div className="mt-12 grid sm:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-10">
   {F.map(([i,t,d])=><div key={t} className="flex gap-4"><div className="h-14 w-14 shrink-0 rounded-[5px] bg-gradient-to-br from-teal/15 to-blue/15 grid place-items-center text-teal"><Icon n={i} className="w-7 h-7"/></div><div><h3 className="font-bold text-lg">{t}</h3><p className="text-slate-600 mt-1">{d}</p></div></div>)}
  </div>
 </section>;
}

function About(){
 return <section id="about" className="bg-ink text-white py-20"><div className="max-w-7xl mx-auto px-4 grid lg:grid-cols-2 gap-12 items-center">
  <div className="relative h-80 rounded-[5px] overflow-hidden bg-gradient-to-br from-teal to-blue grid place-items-center">
   <svg viewBox="0 0 200 100" className="absolute w-[130%] opacity-20" fill="none" stroke="#fff" strokeWidth="5"><path d="M100 50C80 20 30 20 30 50s50 30 70 0 60-30 70 0-50 30-70 0z"/></svg>
   <img src={LOGO} alt="Infinity Academy" width="220" height="220" loading="lazy" className="relative h-52 w-52 rounded-full ring-8 ring-white/20"/>
  </div>
  <div>
   <h2 className="text-3xl sm:text-4xl font-bold">Learn, grow & succeed with Infinity Academy</h2>
   <p className="mt-5 text-white/80">Infinity Academy in Latur is built for students who want strong fundamentals and real results. We teach Science and Maths for Class 6–10 in State Board, CBSE and ICSE, with Foundation courses that prepare students early for NEET and IIT-JEE.</p>
   <p className="mt-4 text-white/80">Our science lab, digital classrooms, experienced faculty and personal mentorship keep every student moving forward, one concept at a time.</p>
   <Btn onClick={()=>go("contact")} className="mt-7">Discover more</Btn>
  </div>
 </div></section>;
}

function Ring(){
 const C=[{img:"studyDesk",t:"NEET Medical"},{n:"flask",t:"Science Lab",g:"from-teal to-blue"},{img:"jee",t:"IIT-JEE"},{n:"monitor",t:"Digital Classrooms",g:"from-blue to-ink"},{img:"kids",t:"Foundation 6–8"},{n:"users",t:"Personal Mentorship",g:"from-teal to-lime"},{img:"group",t:"Regular Classes"},{n:"pencil",t:"Daily Practice (DSP)",g:"from-ink to-teal"},{img:"pilotDoc",t:"Foundation 9–10"},{img:"girl",t:"Class 6–10"}];
 return <section className="bg-mist py-20" aria-label="Life at Infinity Academy">
  <div className="max-w-7xl mx-auto px-4 text-center"><h2 className="text-3xl sm:text-4xl font-bold">Life at Infinity Academy</h2><p className="text-slate-600 mt-3">Hover over a card to bring it to the front.</p></div>
  <div className="fan mt-6"><div className="fan-in">
   {C.map((c,i)=><figure key={i} tabIndex={0} className="ucard m-0" style={{"--i":i}}>
    {c.img?<img src={IMG[c.img]} alt="" loading="lazy" className="absolute inset-0 w-full h-full object-cover"/>:<div className={`absolute inset-0 bg-gradient-to-br ${c.g} grid place-items-center text-white`}><Icon n={c.n} className="w-16 h-16"/></div>}
    <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/75 to-transparent p-3 pt-10"><figcaption className="text-white font-semibold">{c.t}</figcaption></div>
   </figure>)}
  </div></div>
 </section>;
}

function Reviews(){
 const R=[["Parent of a Class 9 student","Foundation Class 9–10","The daily practice and mentor follow-ups improved my child's confidence in Maths."],["NEET aspirant","NEET Program","Biology and Chemistry concepts became clear, and the faculty are always approachable."],["Class 10 student","Regular Class 10","The lab sessions made Science easier, and my board preparation felt organised."]];
 return <section id="reviews" className="max-w-7xl mx-auto px-4 py-20">
  <h2 className="text-3xl sm:text-4xl font-bold text-center">What students and parents say</h2>
  <div className="mt-10 grid md:grid-cols-3 gap-6">
   {R.map(([n,c,t])=><figure key={c} className="bg-mist rounded-[5px] p-7">
    <div className="text-lime text-xl" aria-label="5 stars">★★★★★</div>
    <blockquote className="mt-3 text-slate-700">“{t}”</blockquote>
    <figcaption className="mt-5 flex items-center gap-3"><span className="h-11 w-11 rounded-full bg-gradient-to-br from-teal to-blue text-white grid place-items-center font-bold">{n[0]}</span><span><b className="block">{n}</b><span className="text-sm text-slate-500">{c}</span></span></figcaption>
   </figure>)}
  </div>
 </section>;
}

function CTA(){
 return <section className="max-w-7xl mx-auto px-4 pb-20"><div className="rounded-[5px] bg-gradient-to-r from-teal to-blue text-white text-center px-6 py-14">
  <h2 className="text-3xl sm:text-4xl font-bold">Your future starts with the right foundation!</h2>
  <p className="mt-3 text-white/90 max-w-xl mx-auto">Join Infinity Academy and take the next step towards NEET, IIT-JEE or a strong board result.</p>
  <button onClick={()=>go("contact")} className="mt-7 rounded-[5px] bg-white text-ink px-8 py-3.5 font-semibold hover:shadow-xl transition">Start learning today</button>
 </div></section>;
}

function Footer(){
 const [sent,setSent]=useState(false);
 const L=({children,id})=><li><button onClick={()=>go(id)} className="hover:text-white">{children}</button></li>;
 return <footer id="contact" className="bg-ink text-white/75">
  <div className="max-w-7xl mx-auto px-4 py-16 grid sm:grid-cols-2 lg:grid-cols-4 gap-10">
   <div><div className="flex items-center gap-3 text-white"><img src={LOGO} alt="" width="48" height="48" loading="lazy" className="h-12 w-12 rounded-full"/><b className="font-head text-xl">Infinity Academy</b></div>
    <p className="mt-4 text-sm">NEET · IIT-JEE · Foundation. Science & Maths coaching for Class 6–10 in Latur.</p></div>
   <div><h3 className="text-white font-bold mb-4">Quick links</h3><ul className="space-y-2 text-sm"><L id="home">Home</L><L id="about">About Us</L><L id="programs">Programs</L><L id="courses">Courses</L><L id="reviews">Reviews</L></ul></div>
   <div><h3 className="text-white font-bold mb-4">Contact</h3><address className="not-italic text-sm space-y-2"><p>Infinity Academy, near Patil Plaza, Ausa Road, Latur</p><p>Phone: <span className="text-white">add number</span></p>
    <a className="inline-block mt-1 text-teal underline" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Infinity+Academy+near+Patil+Plaza+Ausa+Road+Latur">Open in Google Maps</a></address></div>
   <div><h3 className="text-white font-bold mb-4">Get updates</h3>
    {sent?<p className="text-sm text-lime">Thanks! We'll keep you posted.</p>:<form onSubmit={e=>{e.preventDefault();setSent(true)}} className="flex gap-2"><input required type="email" aria-label="Email" placeholder="Your email" className="min-w-0 flex-1 rounded-[5px] px-4 py-2.5 text-ink"/><button className="rounded-[5px] bg-teal text-white px-4 font-semibold">Join</button></form>}
    <div className="flex gap-3 mt-5">{["f","in","yt"].map(s=><span key={s} className="h-9 w-9 rounded-[5px] bg-white/10 grid place-items-center text-xs font-bold text-white">{s}</span>)}</div></div>
  </div>
  <div className="border-t border-white/10 text-center text-sm py-5">© 2026 Infinity Academy, Latur. All rights reserved.</div>
 </footer>;
}

function App(){
 const [q,setQ]=useState(""),[cat,setCat]=useState("All");
 return <><Header/><main><Hero {...{q,setQ,cat,setCat}}/><Programs setCat={setCat}/><Courses {...{q,setQ,cat,setCat}}/><Why/><About/><Ring/><Reviews/><CTA/></main><Footer/></>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
